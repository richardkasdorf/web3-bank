
services:
  # Keys (Vault)
  vault:
    image: hashicorp/vault:1.15
    container_name: bank_vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "root_token_estudo" 
    cap_add:
      - IPC_LOCK 

  # Bank (FastAPI)
  api:
    build: .
    container_name: bank_api
    command: sh -c "uvicorn app:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    depends_on:
      - vault
    environment:
      - VAULT_URL=http://vault:8200
      - VAULT_TOKEN=root_token_estudo
      - CIRCLE_API_KEY=${CIRCLE_API_KEY}
      - HEX_ENCODED_ENTITY_SECRET=${HEX_ENCODED_ENTITY_SECRET}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    working_dir: /app
    volumes:
      - .:/app
      - bank_data:/data
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    
  db:
    image: postgres:15
    container_name: bank_db
    restart: always
    environment:
      POSTGRES_USER: user_admin
      POSTGRES_PASSWORD: password_123
      POSTGRES_DB: bank_digital
    ports:
      - "5432:5432"

  adminer:
    image: adminer
    restart: always
    ports:
      - 8080:8080

  ngrok:
    image: ngrok/ngrok:latest
    restart: always
    profiles: ["tunnel"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4040:4040"
    command: ["http", "host.docker.internal:11434", "--host-header=localhost:11434"]
    environment:
      - NGROK_AUTHTOKEN=${NGROK_TOKEN}
    depends_on:
      - api

volumes:
  bank_data:




